<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening the App Store — Altar</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.png" type="image/png">
<script>
// Forward to the App Store, passing an optional ?ct= campaign token through as &ct=.
// Only letters, digits, dot, dash and underscore are kept (App Store campaign tokens are short).
(function () {
  var base = "https://apps.apple.com/app/id6820071184";
  var ct = new URLSearchParams(location.search).get("ct");
  if (ct) ct = ct.replace(/[^A-Za-z0-9._-]/g, "").slice(0, 40);
  location.replace(ct ? base + "?ct=" + encodeURIComponent(ct) : base);
})();
</script>
<meta http-equiv="refresh" content="1;url=https://apps.apple.com/app/id6820071184">
<style>
:root{--bg:#FBF5EA;--ink:#24204A;--a:#8A5A12}
@media (prefers-color-scheme:dark){:root{--bg:#14152E;--ink:#FBF5EA;--a:#FFD58A}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:center;padding:16px}
a{color:var(--a)}
</style>
</head>
<body>
<main>
<p>Opening Altar on the App Store…</p>
<p><a href="https://apps.apple.com/app/id6820071184">Tap here if nothing happens.</a></p>
</main>
</body>
</html>
